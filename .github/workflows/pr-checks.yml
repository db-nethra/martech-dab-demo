name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run pytest
        run: uv run pytest
      - name: Run ruff
        run: uv run ruff check pipeline scripts "notebooks/Validate Promotion.py"

  plan:
    name: Validate bundle and record prod plan
    runs-on: ubuntu-latest
    env:
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate prod target
        run: databricks bundle validate -t prod
      - name: Generate deployment plan
        run: |
          databricks bundle plan -t prod | tee plan.txt
          {
            echo "## Prod deployment plan"
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain plan as release evidence
        uses: actions/upload-artifact@v4
        with:
          name: prod-deployment-plan
          path: plan.txt
          retention-days: 90
